name: "Staging — Post deployment"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "tests/**"

# Limit execution to 1 and also makes new trigger events cancel currently running workflow
concurrency:
  group: staging-post-deployment
  cancel-in-progress: true

env:
  AWS_ACCOUNT_ID: ${{ vars.STAGING_AWS_ACCOUNT_ID }}
  AWS_REGION: ca-central-1

permissions:
  id-token: write
  contents: write
  security-events: write

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build --platform=linux/amd64 --provenance false -t forms-api .

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/forms-api-plan
          role-session-name: StagingPostDeployment
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Staging Amazon ECR
        id: login-ecr-staging
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78

      - name: Docker generate SBOM
        uses: cds-snc/security-tools/.github/actions/generate-sbom@837a88b6337d4842543184c8eac97a8adac8f302 # v4.0.3
        env:
          TRIVY_DB_REPOSITORY: ${{ vars.LOCAL_TRIVY_DB_REPOSITORY }}
        with:
          docker_image: "forms-api"
          dockerfile_path: "Dockerfile"
          token: "${{ secrets.GITHUB_TOKEN }}"

  report-to-sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Report deployment to Sentinel
        uses: cds-snc/sentinel-forward-data-action@e358bf24b818e68a22c9736715a3b544851aaba8 # main
        with:
          input_data: '{"product": "forms", "sha": "${{ github.sha }}", "version": "${{ github.sha }}", "repository": "${{ github.repository }}", "environment": "staging", "status": "${{ job.status }}"}'
          log_type: CDS_Product_Deployment_Data
          log_analytics_workspace_id: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
          log_analytics_workspace_key: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}
